name: sentra
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://sentra:sentra@postgres/sentra
    BROKER_URL: amqp://sentra:sentra@rabbitmq:5672//
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  api:
    <<: *app
    ports: ["127.0.0.1:8765:8765"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/scans', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["celery", "-A", "worker:app", "worker", "--loglevel=INFO", "--concurrency=2"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: sentra, POSTGRES_USER: sentra, POSTGRES_PASSWORD: sentra}
    volumes: ["reports:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "sentra"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:4-alpine
    environment: {RABBITMQ_DEFAULT_USER: sentra, RABBITMQ_DEFAULT_PASS: sentra}
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 8s, retries: 20}
volumes:
  reports:

